<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6efe5"/>
      <stop offset="1" stop-color="#d3e2d1"/>
    </linearGradient>
    <!-- Blueprint grid: small squares + bold lines every 5 squares -->
    <pattern id="grid" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M40 0V200M80 0V200M120 0V200M160 0V200M0 40H200M0 80H200M0 120H200M0 160H200"
            stroke="#2c882b" stroke-opacity="0.07" stroke-width="1"/>
      <path d="M0 0V200M0 0H200" stroke="#2c882b" stroke-opacity="0.14" stroke-width="2"/>
    </pattern>
    <!-- Ruler ticks -->
    <pattern id="ruler" width="20" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 0V16M10 0V9" stroke="#2c882b" stroke-opacity="0.3" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Ruler along the bottom -->
  <rect y="870" width="1600" height="16" fill="url(#ruler)"/>
  <rect y="868" width="1600" height="2" fill="#2c882b" fill-opacity="0.3"/>

  <!-- Large blueprint-style tool outlines -->
  <g fill="none" stroke="#2c882b" stroke-opacity="0.24" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">

    <!-- Gear (top left) -->
    <g transform="translate(200 300) scale(3.4)">
      <circle r="16"/>
      <circle r="6"/>
      <rect x="-4" y="-26" width="8" height="8"/>
      <rect x="-4" y="-26" width="8" height="8" transform="rotate(45)"/>
      <rect x="-4" y="-26" width="8" height="8" transform="rotate(90)"/>
      <rect x="-4" y="-26" width="8" height="8" transform="rotate(135)"/>
      <rect x="-4" y="-26" width="8" height="8" transform="rotate(180)"/>
      <rect x="-4" y="-26" width="8" height="8" transform="rotate(225)"/>
      <rect x="-4" y="-26" width="8" height="8" transform="rotate(270)"/>
      <rect x="-4" y="-26" width="8" height="8" transform="rotate(315)"/>
    </g>

    <!-- Wrench (top right) -->
    <g transform="translate(1400 300) rotate(40) scale(3.4)">
      <rect x="-5" y="-6" width="10" height="52" rx="5"/>
      <circle cy="-16" r="13"/>
      <circle cy="-16" r="5"/>
    </g>

    <!-- Hammer (bottom left) -->
    <g transform="translate(230 640) rotate(-40) scale(3.4)">
      <rect x="-4" y="-4" width="8" height="48" rx="3"/>
      <rect x="-18" y="-20" width="36" height="16" rx="3"/>
    </g>

    <!-- Hard hat (bottom right) -->
    <g transform="translate(1380 700) scale(3.6)">
      <path d="M-24 8 A24 24 0 0 1 24 8 Z"/>
      <rect x="-32" y="8" width="64" height="7" rx="3"/>
      <rect x="-4" y="-17" width="8" height="25"/>
    </g>

    <!-- Measuring marks -->
    <path d="M60 120 H340 M60 108 V132 M340 108 V132"/>
    <path d="M1260 800 H1540 M1260 788 V812 M1540 788 V812"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
